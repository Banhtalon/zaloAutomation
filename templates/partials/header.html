<!-- HEADER (HIGH CONTRAST CRISP WHITE WITH STRONG BOTTOM BORDER) -->
<header class="app-header glass-panel flex items-center justify-between shrink-0 z-10 gap-4">
    <div class="flex items-center gap-3 min-w-0">
        <div class="w-2 h-7 rounded-full bg-blue-600 shrink-0" aria-hidden="true"></div>
        <div class="min-w-0">
            <h1 class="font-extrabold tracking-tight text-balance leading-none min-w-0" id="header-title">Zalo Auto</h1>
            <p class="text-xs font-semibold text-slate-600 mt-1 hidden sm:block truncate">Hệ thống kiểm duyệt tự động báo cáo nhóm Zalo &amp; đồng bộ LMS</p>
        </div>
    </div>

    <div class="flex items-center gap-2.5 min-w-0 justify-end">
        <span id="runtime-mode-badge" class="mode-badge mode-badge--unknown" aria-label="Chế độ chạy hiện tại">Đang kiểm tra</span>
        <button id="job-cancel-button" type="button" onclick="cancelCurrentJob()" class="hidden btn-3d px-3 py-1.5 rounded-lg border-2 border-rose-600 border-b-4 border-b-rose-900 bg-rose-600 text-xs font-bold text-white hover:bg-rose-700 disabled:opacity-50">
            Hủy job
        </button>
        <button id="job-retry-button" type="button" onclick="retryCurrentJob()" class="hidden btn-3d px-3 py-1.5 rounded-lg border-2 border-blue-600 border-b-4 border-b-blue-900 bg-blue-600 text-xs font-bold text-white hover:bg-blue-700 disabled:opacity-50">
            Thử lại
        </button>
        <div class="job-status-pill flex items-center px-3.5 py-2 rounded-xl border-2" role="status" aria-live="polite">
            <span class="relative flex h-2.5 w-2.5 mr-2.5 shrink-0">
                <span id="pulse-dot" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span id="status-dot" class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-400"></span>
            </span>
            <span id="status-text" class="text-xs font-bold tracking-tight">Chưa có job đang chạy</span>
        </div>
    </div>
</header>
