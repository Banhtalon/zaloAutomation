<!-- HEADER -->
<header class="app-header glass-panel flex items-center justify-between shrink-0 z-10 gap-4">
    <h1 class="font-extrabold tracking-tight text-balance min-w-0" id="header-title">Zalo Auto</h1>

    <div class="flex items-center gap-2 min-w-0 justify-end">
        <span id="runtime-mode-badge" class="mode-badge mode-badge--unknown" aria-label="Chế độ chạy hiện tại">Đang kiểm tra</span>
        <button id="job-cancel-button" type="button" onclick="cancelCurrentJob()" class="hidden px-3 py-1.5 rounded-lg border border-rose-200 bg-rose-50 text-xs font-semibold text-rose-600 hover:bg-rose-100 disabled:opacity-50">
            Hủy job
        </button>
        <button id="job-retry-button" type="button" onclick="retryCurrentJob()" class="hidden px-3 py-1.5 rounded-lg border border-blue-200 bg-blue-50 text-xs font-semibold text-blue-600 hover:bg-blue-100 disabled:opacity-50">
            Thử lại
        </button>
        <div class="job-status-pill flex items-center px-4 py-2 rounded-full border" role="status" aria-live="polite">
            <span class="relative flex h-2.5 w-2.5 mr-2.5 shrink-0">
                <span id="pulse-dot" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                <span id="status-dot" class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
            </span>
            <span id="status-text" class="text-xs font-bold text-slate-600 tracking-wide">Chưa có job đang chạy</span>
        </div>
    </div>
</header>
